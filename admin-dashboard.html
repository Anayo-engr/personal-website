<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Personal Website</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>

<body>

    <!-- =====================================================
         ADMIN HEADER
    ====================================================== -->

    <header class="admin-header">

        <div class="admin-header-content">

            <div>
                <h1>Admin Dashboard</h1>
                <p>Personal Website Administration</p>
            </div>

            <button
                id="logoutButton"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="admin-dashboard">

        <!-- Welcome Section -->

        <section class="dashboard-welcome">

            <h2>Welcome, Administrator</h2>

            <p>
                You are successfully logged in to the
                personal website administration area.
            </p>

        </section>


        <!-- Client Inquiries -->

        <section class="dashboard-card">

            <div class="dashboard-card-header">

                <div>
                    <h2>Client Inquiries</h2>

                    <p id="dashboardMessage">
                        Loading inquiries...
                    </p>
                </div>

            </div>


            <!--
                JavaScript will automatically insert
                the dashboard summary here.
            -->


            <div id="inquiriesContainer">

                <p>
                    Loading client inquiries...
                </p>

            </div>

        </section>

    </main>


    <!-- =====================================================
         ADMIN DASHBOARD JAVASCRIPT
    ====================================================== -->

    <script src="admin-dashboard.js"></script>

</body>
</html>
