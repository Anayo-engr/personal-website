<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Gradient for the main icon -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="100%" stop-color="#2b6cb0" />
    </linearGradient>
    <!-- Gradient for the accent elements -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d69e2e" />
      <stop offset="100%" stop-color="#ecc94b" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background container optional (transparent by default) -->
  
  <g transform="translate(10, 10)">
    <!-- ICON GRAPHIC: Merging Construction Structure & Code/Tech Brackets -->
    <g filter="url(#dropShadow)">
      <!-- Outer Hexagon / Shield base representing strength and structure -->
      <polygon points="50,15 85,35 85,75 50,95 15,75 15,35" fill="url(#primaryGrad)" stroke="#ffffff" stroke-width="3" />
      
      <!-- Architectural Roof / Compass Lines -->
      <polyline points="25,45 50,25 75,45" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Tech Code Brackets Integration (< >) overlapping the center -->
      <path d="M 35,55 L 25,65 L 35,75" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 65,55 L 75,65 L 65,75" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Center vertical pillar / beam -->
      <line x1="50" y1="35" x2="50" y2="85" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- TYPOGRAPHY: Brand Name & Slogan -->
    <g transform="translate(110, 0)">
      <!-- Main Name -->
      <text x="0" y="45" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="28" fill="#1a365d" letter-spacing="0.5">
        Nworie Anayo Andrew
      </text>
      
      <!-- Profession Subtitle -->
      <text x="2" y="70" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="13" fill="#d69e2e" letter-spacing="1.5">
        SOFTWARE ENGINEER &amp; CONSTRUCTION EXPERT
      </text>

      <!-- Decorative line separating text and accent -->
      <line x1="2" y1="85" x2="330" y2="85" stroke="#e2e8f0" stroke-width="2" />

      <!-- Minimalist engineering indicator text -->
      <text x="2" y="105" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="400" font-size="11" fill="#718096" letter-spacing="1">
        STRUCTURES • CODE • INNOVATION
      </text>
    </g>
  </g>
</svg>

